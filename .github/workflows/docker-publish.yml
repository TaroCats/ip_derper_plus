name: Docker

on:
  push:
    branches: ["main"]
    # 发布 semver tag 时打版本标签
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 注意：这里不再定义 IMAGE_NAME。
  # github.repository 保留原始大小写（本仓库是 TaroCats/ip_derper_plus），
  # 而 GHCR 强制镜像名全小写，直接拼接会报：
  #   invalid reference format: repository name must be lowercase
  # 请统一使用 build job 里 image-ref 步骤产出的 steps.image-ref.outputs.image
  #（smoke-test 通过 needs.build.outputs.image 复用），不要手工拼镜像名。

jobs:
  # ---------------------------------------------------------------------------
  # 构建并推送多架构镜像
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    # 把已小写化的镜像引用传给 smoke-test，保证两者用的是同一个地址
    outputs:
      image: ${{ steps.image-ref.outputs.image }}

    steps:
      # ---------------------------------------------------------------
      # 1. 计算镜像引用（必须全小写）
      #
      # GHCR 强制镜像名全小写，而 github.repository 保留原始大小写
      # （本仓库是 TaroCats/ip_derper_plus）。docker/metadata-action
      # 内部会自动小写化，所以 build/push 不会报错；但任何手工拼接
      # 镜像名的地方（如 smoke-test 的 docker pull）都会炸：
      #   invalid reference format: repository name must be lowercase
      #
      # 这里显式小写化，作为唯一的镜像名来源。
      # ---------------------------------------------------------------
      - name: Compute lowercase image reference
        id: image-ref
        run: |
          # 只有仓库名的 owner/name 部分需要小写，registry 主机名保持原样
          owner_repo="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          image="${{ env.REGISTRY }}/${owner_repo}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "镜像引用（已小写化）: ${image}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # submodules: true 只会检出 submodule 记录的 pinned commit，
          # 保证构建可复现（不要用 recursive/remote，否则每次构建内容都可能不同）
          submodules: true

      - name: Set up QEMU
        # arm64 平台构建需要模拟。builder 已固定在 BUILDPLATFORM 上交叉编译，
        # QEMU 只用于最终镜像的组装步骤，开销很小。
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 用已小写化的镜像引用，避免 registry 因大小写拒收
          images: ${{ steps.image-ref.outputs.image }}
          tags: |
            # 分支/PR 构建打 edge 标签，避免覆盖 latest
            type=ref,event=branch
            type=ref,event=pr
            # semver：v1.2.3 -> 1.2.3 / 1.2 / 1，并更新 latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main 分支的每次推送更新 latest
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ip_derper_plus
            org.opencontainers.image.description=Tailscale DERP relay with self-signed cert support

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PR 只构建不推送，用于验证 Dockerfile 没坏
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 把 derper 版本注入镜像，便于运行时排查
          build-args: |
            DERP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # ---------------------------------------------------------------------------
  # 冒烟测试：真正把镜像跑起来，验证「容器能启动」这件事
  #
  # 这是本次改进的重点。原 CI 只做 build+push，从不运行镜像，
  # 所以「基础镜像没有 bash 导致容器起不来」这类致命问题一直没被发现。
  # ---------------------------------------------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    # 镜像只在非 PR 时被推送，所以只在推送场景做拉取校验
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: |
          # 复用 build job 已小写化的镜像引用，避免各处手工拼接导致
          # 「repository name must be lowercase」这类大小写问题。
          # 用 main 分支/最新 tag 做冒烟；若为 tag 推送则用该版本。
          IMAGE_BASE='${{ needs.build.outputs.image }}'
          if [ "${{ github.ref_type }}" = "tag" ]; then
            IMAGE="${IMAGE_BASE}:${GITHUB_REF_NAME#v}"
          else
            IMAGE="${IMAGE_BASE}:latest"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "拉取镜像: $IMAGE"
          docker pull "$IMAGE"

      - name: Start container
        run: |
          # 用非 443 端口避免权限问题；禁用 STUN 端口冲突影响
          docker run -d --name smoke \
            -e DERP_HOST=1.2.3.4 \
            -e DERP_ADDR=:8443 \
            -e DERP_HTTP_PORT=8080 \
            -e DERP_STUN_PORT=3479 \
            -p 8080:8080 \
            "$IMAGE"

      - name: Assert container is running (not crash-looping)
        run: |
          # 等 15s 让证书生成 + derper 启动完成
          sleep 15
          if ! docker ps --format '{{.Names}}' | grep -q '^smoke$'; then
            echo "::error::容器已退出，说明启动流程失败"
            docker logs smoke
            exit 1
          fi
          echo "容器运行中"
          docker logs smoke

      - name: Assert derper actually serves traffic
        run: |
          # /generate_204 挂在 HTTP 端口，不经重定向，是最稳的存活探针
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/generate_204 || true)
            if [ "$code" = "204" ]; then
              echo "derper 正常响应 204"
              exit 0
            fi
            sleep 2
          done
          echo "::error::derper 未响应，实际状态码: $code"
          docker logs smoke
          exit 1

      - name: Assert cert was generated with correct SAN
        run: |
          # 验证证书确实生成、且 IP 放在了 IP SAN（不是塞进 DNS）
          docker exec smoke ls -l /app/certs
          docker exec smoke sh -c 'openssl x509 -in /app/certs/1.2.3.4.crt -noout -text | grep -E "IP Address|DNS:"'

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true
