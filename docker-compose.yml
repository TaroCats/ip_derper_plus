# IP DERPer Plus —— 默认部署模板（**带防盗**）
#
# 这是默认配置：启动本地 tailscaled，只有同一 tailnet 的节点才能使用这台 DERP。
#
#   启动:   docker compose up -d
#   状态:   docker compose ps
#   日志:   docker compose logs -f
#   停止:   docker compose down
#
#   不需要校验客户端（谁都能用）时，改用基础模板：
#     docker compose -f docker-compose.basic.yml up -d
#
# ---------------------------------------------------------------------------
# ⚠️ 环境变量生效规则（很多人栽在这里）
#
#   .env 里的值**必须**在本文件 environment 段用 ${VAR:-默认} 引用才会生效。
#   直接写死的值会覆盖 .env，导致「改了 .env 却没反应」。
#   本文件所有变量都已按此规则配置，.env 的改动会真实传进容器。
#
#   例外：DERP_CERTS / DERP_CONFIG 若改动，必须同时改下面 volumes 挂载点，
#   否则数据写进容器内层、重建即丢。一般保持默认即可。
#
# ---------------------------------------------------------------------------
# 三个卷必须持久化，否则重启会出问题：
#
#   derper-certs    -> /app/certs
#       证书目录。丢失会重签证书，而客户端 DERPMap 里记录的是证书哈希
#       （CertName: sha256-raw:...），哈希一变已配置的节点全部失效。
#
#   derper-nodekey  -> /var/lib/derper
#       derper 的 nodekey。丢失会生成新的节点身份，mesh / 防盗链路全部失效。
#       老部署升级时务必补上这个卷。
#
#   derper-state    -> /var/lib/tailscale
#       tailscaled 登录态。丢失需要重新登录。
#
# ---------------------------------------------------------------------------
# 其他注意
#
#   1. DERP_HOST 必填，改成公网 IP 或域名。先 cp .env.example .env 再改。
#   2. TS_AUTHKEY 必填：Tailscale 控制台生成的 authkey，否则无法登录、防盗不生效。
#   3. 防盗依赖 NET_ADMIN + /dev/net/tun。云厂商「应用托管」类产品（如雨云云应用）
#      一般不提供，只能跑在 vm / k8s / 自有服务器上。
#   4. 使用 host 网络：STUN 与 DERP 都走 UDP，NAT 后做端口映射容易出问题。
#      host 模式下端口直接占宿主端口，故本文件不写 ports，属正常现象。
#
# ---------------------------------------------------------------------------

services:
  derper:
    image: ghcr.io/tarocats/ip_derper_plus:latest
    container_name: ip-derper
    restart: unless-stopped

    # host 网络：避免 UDP 端口映射带来的 NAT 问题
    network_mode: host

    cap_add:
      - NET_ADMIN              # tailscaled 需要
    devices:
      - "/dev/net/tun:/dev/net/tun"

    environment:
      # —— 必填 ——
      # :? 表示未设置时直接报错退出，避免用 127.0.0.1 起了个连不上的服务
      DERP_HOST: "${DERP_HOST:?请在 .env 或环境变量里设置 DERP_HOST 为公网 IP 或域名}"

      # —— 监听与端口 ——
      DERP_ADDR: "${DERP_ADDR:-:443}"
      DERP_HTTP_PORT: "${DERP_HTTP_PORT:-80}"
      DERP_STUN: "${DERP_STUN:-true}"
      DERP_STUN_PORT: "${DERP_STUN_PORT:-3478}"

      # —— 证书与节点私钥路径 ——
      DERP_CERTS: "${DERP_CERTS:-/app/certs}"
      DERP_CONFIG: "${DERP_CONFIG:-/var/lib/derper/derper.key}"
      # 设为 1 强制重签证书。改了 DERP_HOST 后要换证书时用
      FORCE_CERT_REGEN: "${FORCE_CERT_REGEN:-0}"

      # —— 防盗：本模板默认开启 ——
      DERP_VERIFY_CLIENTS: "${DERP_VERIFY_CLIENTS:-true}"

      # TS_AUTHKEY 必填。为空且无历史登录态时，entrypoint 会降级为不校验并打印警告。
      TS_AUTHKEY: "${TS_AUTHKEY:?请在 .env 里设置 TS_AUTHKEY，否则防盗无法生效}"
      TS_STATE_DIR: "${TS_STATE_DIR:-/var/lib/tailscale}"
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:---advertise-tags=tag:container}"
      TS_SOCKET: "${TS_SOCKET:-/var/run/tailscale/tailscaled.sock}"

    volumes:
      # 挂载点与上面 DERP_CERTS 保持一致（DERP_CONFIG 所在目录固定为 /var/lib/derper）
      - derper-certs:${DERP_CERTS:-/app/certs}
      - derper-nodekey:/var/lib/derper
      - derper-state:${TS_STATE_DIR:-/var/lib/tailscale}

    # 健康检查用 /generate_204，不用 /derp/probe：
    # 后者在 HTTP 端口会被 302 重定向到 https，而 https 是自签证书，curl 校验必失败。
    # 必须用 CMD-SHELL 才能让变量在运行时展开；exec 形式（CMD [...]）不展开变量。
    # $$ 是转义，避免 compose 在解析时就把变量吃掉。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${DERP_HTTP_PORT:-80}/generate_204"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s    # 要等 tailscaled 登录，给足启动时间

volumes:
  derper-certs:
  derper-nodekey:
  derper-state:
